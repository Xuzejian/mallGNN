[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mallgnn"
version = "0.1.0"
description = "Temporal shop fulfillment risk prediction with tabular features and relational GraphSAGE"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "scikit-learn>=1.3,<2",
    "torch>=2.2,<3",
]

[project.scripts]
mallgnn = "mallgnn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
